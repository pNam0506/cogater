<title>Report</title>
{% endblock %}

    border-radius: 20px;
    box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);

  }

  textarea {
    border-radius: 10px;
  }

<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
<div id="app">
  <div class="date" style="font-size: 24px; font-weight: bold; margin: 20px;">
    Date: ${ time }
  </div>



  <div style=" display: grid; grid-template-columns: repeat(1); gap: 10px; ">

    <div class="box">

      <div style="margin-left: 50px; ">
        <h3>Main Information (For Company)</h3>
      </div>


      <div style="display: grid; grid-template-columns: repeat(2, 200px); gap: 10px; margin-left: 25%;">

        <div>
          <label>Company Name</label><br>
          <textarea name="name" style="width: 200px; height: 50px; padding-inline-start: 0; resize: none; white-space: pre-wrap;"
            placeholder="พิมพ์ข้อความที่นี่..."></textarea>
        </div>

        <div>
          <label>Store</label><br>
          <textarea name="store" style="width: 300px; height: 50px; padding-inline-start: 0; resize: none; white-space: pre-wrap;"
            placeholder="สาขา..."></textarea>
        </div>

        <div class="input-group" style="grid-row: 2/3 ;">
          
           <label>Logo</label><br>

          <input type="file" id="picture_multi" name="picture_multi" accept="image/*" style="display: none;">

          <img id="preview_multi"
            src="add-symbol-svgrepo-com.png"
            style="width: 200px; height: 200px; margin-top: 10px; cursor: pointer; object-fit: cover;">
        </div>

        

        <div>
            <div>
              <label>Company Address</label><br>
            </div>
            <div>
              <textarea name="address" style="width: 300px; height: 100px; padding-inline-start: 0; resize: none; white-space: pre-wrap;"
              placeholder="ที่อยู่บริษัท..."></textarea>
            </div>

        </div>

        <div>
          <label>Email</label><br>
          <textarea name="email" style="width: 200px; height: 50px; padding-inline-start: 0; resize: none; white-space: pre-wrap;"
            placeholder="ชื่อผู้ติดต่อส่วนกลาง..."></textarea>
        </div>

        <div>
          <label>Website</label>
          <textarea name="website" style="width: 200px; height: 50px; padding-inline-start: 0; resize: none; white-space: pre-wrap;"
            placeholder="ชื่อผู้ติดต่อส่วนกลาง..."></textarea>
        </div>


        <div>
          <label>Operator Name</label><br>
          <textarea name="operator" style="width: 200px; height: 50px; padding-inline-start: 0; resize: none; white-space: pre-wrap;"
            placeholder="ชื่อผู้ติดต่อส่วนกลาง..."></textarea>
        </div>

        <div>
          <label for="phone">Phone</label>
          <input style="border-radius: 10px;" type="tel" id="phone" name="phone" placeholder="กรอกเบอร์โทรศัพท์"
            pattern="^0[0-9]{9}$" title="กรุณากรอกเบอร์โทรศัพท์ให้ถูกต้อง (เช่น 0812345678)" maxlength="10" required>
          <span id="error" class="error">กรอกได้เฉพาะตัวเลขเท่านั้น</span>
        </div>

        




      </div>

      <div>
        <input type="submit" value="Save" style="position: relative; margin-left: 1000px; width: 100px;">
      </div>

    </div>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/vue@2"></script>
  <script>
    new Vue({
      el: '#app',
      delimiters: ['${', '}'], // ใช้ ${ ... } แทน {{ ... }} เพื่อไม่ชนกับ Django
      
      data: {

        table_header: [
          { text: 'No', value: 'no', align: 'start' },
          { text: 'Size', value: 'size' },
          { text: 'Detail', value: 'Size_Detail' },
          { text: 'Price', value: 'Price' },
          { text: 'Actions', value: 'actions', sortable: false }
        ],

        Default_item_params: {
          Color: '',
          Company_name: '',
          Store: '',
          Company_Address: '',
          Operator_Name: '',
          Phone: '',
        },

        item_params: {
          Color: '',
          size: '',
          Size_Detail: '',
          Price: '',

        },

        product: [],
        params: [],
        time: '{{ current_time }}',
        value: '',
        item: [],
        Color: [],
        showColors: false, // ตัวควบคุมการแสดงผล
        AddItem: false

      },
      methods: {
        updateClock() {
          const now = new Date();
          this.time = now.toLocaleTimeString('th-TH', {
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
          });
        },
        addColor() {
          const newColor = '#ffffff'; // สีใหม่เริ่มต้น
          this.Color = newColor;
        },
        removeColor(index) {
          this.Color.splice(index, 1);
          this.params.splice(index, 1);
        },
        // SaveColor() {

          
        //   if (this.params.length >= 0) {
        //     this.showColors = true; // แสดงสีเมื่อกด save
        //     this.item = [...this.params]; // คัดลอกค่าทั้งหมดจาก params ไปใส่ใน item
        //   } else {
        //     alert('ยังไม่มีสีให้บันทึกนะคั้บ');
        //   }
        // },
        AddList() {
          this.AddItem = true;
          // push สำเนาใหม่ของ item_params เพื่อแยกแต่ละรายการ
          this.product.push({ ...this.item_params });
        },
        AddtoTable() {
          this.$http.post('report/',{
                            'po_no':this.params.po_no,
                            'store_code':this.default_storecode,
                            'po_date':this.params.po_date,
                            'supplier':this.params.supplier,
                            'dt_set': this.datas_select_items
                        }, config)
          // เพิ่มข้อมูลใหม่ (จำลองตัวอย่าง)
          const newItem = {
            size: this.item_params.size || 'M',
            Size_Detail: this.item_params.Size_Detail || 'Sample detail',
            Price: this.item_params.Price || '200'
          };
          this.item.push(newItem);
        },
        deleteRow(index) {
          this.item.splice(index, 1);
        },

        removeItem(index) {
          this.product.splice(index, 1);
        },

        previewImage(event, index) {
          const file = event.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = e => {
              document.getElementById('preview_size_' + index).src = e.target.result;
            };
            reader.readAsDataURL(file);
          }
        }



      },
      mounted() {
        this.updateClock();
        setInterval(this.updateClock, 1000);
      },


    });

    const phone = document.getElementById('phone');
    const error = document.getElementById('error');

    phone.addEventListener('keydown', function (event) {
      const allowedKeys = ['Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'Tab', 'Enter'];

      // อนุญาตเฉพาะตัวเลขหรือปุ่มพิเศษ
      if ((event.key >= '0' && event.key <= '9') || allowedKeys.includes(event.key)) {
        error.style.display = 'none'; // ซ่อนข้อความเตือนเมื่อพิมพ์ถูก
        return;
      } else {
        event.preventDefault(); // บล็อกตัวอักษรที่ไม่ใช่ตัวเลข
        error.style.display = 'block'; // แสดงข้อความเตือน
      }
    });

    const pictureInput_multi = document.getElementById('picture_multi');
    const preview_multi = document.getElementById('preview_multi');

     preview_multi.addEventListener("click", () => {
  pictureInput_multi.click();
});

// Show preview instantly
pictureInput_multi.addEventListener("change", () => {
  const file = pictureInput_multi.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = e => preview_multi.src = e.target.result;
  reader.readAsDataURL(file);
});

    const pictureInput = document.getElementById('picture');
    const preview = document.getElementById('preview');

    pictureInput.addEventListener('change', function () {
      const file = this.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
          preview.src = e.target.result;
          preview.style.display = 'block';
        }
        reader.readAsDataURL(file);
      } else {
        preview.style.display = 'none';
      }
    });

    preview_multi.addEventListener('click', () => {
      modalImg.src = preview_multi.src;
      modal.style.display = 'flex';
    });



    const change_image = document.getElementById('change_image');

    change_image.addEventListener('click', () => pictureInput.click())

    const modal = document.getElementById('modal');
    const modalImg = document.getElementById('modalImg');
    const closeModal = document.getElementById('closeModal');



    // คลิกที่ preview เพื่อเปิด modal
    preview.addEventListener('click', () => {
      modalImg.src = preview.src;
      modal.style.display = 'flex';
    });

    // ปิด modal
    closeModal.addEventListener('click', () => modal.style.display = 'none');
    modal.addEventListener('click', e => {
      if (e.target === modal) modal.style.display = 'none';
    });


    const change_image_multi = document.getElementById('change_image_multi');

    change_image_multi.addEventListener('click', () => pictureInput_multi.click())

    // const AddColor = document.getElementById('AddColor');
    // const AddButton = document.getElementById('Add_button');
    // const colorCode = document.getElementById('colorCode');



    // AddButton.addEventListener('click', () => {
    //   const color = AddColor.value; // ดึงค่าสีจาก input
    //   console.log('เลือกสี:', color);
    // });

    // AddColor.addEventListener('input', () => {
    //   colorCode.value = AddColor.value; // อัปเดตช่อง text ให้ตรงกัน
    // });

    // colorCode.addEventListener('input', () => {
    //   const val = colorCode.value;
    //   // ตรวจสอบว่ารหัสสีถูกต้อง (# + 6 ตัว hex)
    //   if (/^#[0-9A-Fa-f]{6}$/.test(val)) {
    //     AddColor.value = val; // อัปเดต color picker ให้ตรงกัน
    //   }
    // });

    // AddButton.addEventListener('click', () =>
    //   AddColor.click()
    // );

    const pictureInput_size = document.getElementById('picture_size');
    const preview_size = document.getElementById('preview_size');

    pictureInput_size.addEventListener('change', function () {
      const file = this.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
          preview_size.src = e.target.result;
          preview_size.style.display = 'block';
        }
        reader.readAsDataURL(file);
      } else {
        preview_size.style.display = 'none';
      }
    });


    const change_image_size = document.getElementById('change_image_size');

    change_image_size.addEventListener('click', () => pictureInput_size.click())
  </script>
  {% endblock %}
