{% extends "base_web.html" %} {% block title %}
<title>Report</title>
{% endblock %} {% block content %}

<style>
  body {
    background: #f4f6f9;
  }
  .container {
    width: 95%;
    margin: auto;
    margin-top: 20px;
  }

  .section-box {
    background: #fff;
    border-radius: 20px;
    padding: 25px;
    margin-bottom: 30px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
  }

  .section-title {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 20px;
  }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
  }

  input,
  select,
  textarea {
    width: 100%;
    padding: 8px;
    border-radius: 8px;
    border: 1px solid #ccc;
  }

  textarea {
    resize: none;
  }

  .horizontal-images {
    display: flex;
    gap: 15px;
    overflow-x: auto;
    margin-top: 10px;
  }

  .add-box {
    width: 200px;
    height: 200px;
    border: 2px dashed #bbb;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border-radius: 10px;
    font-size: 40px;
    color: #999;
  }

  .delete-btn {
    position: absolute;
    top: 5px;
    right: 5px;
    background: red;
    color: white;
    border: none;
    border-radius: 50%;
    width: 25px;
    height: 25px;
    cursor: pointer;
  }

  .btn {
    padding: 8px 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  .btn-save {
    background: #e61b40;
    color: white;
  }
  .btn-add {
    background: gray;
    color: white;
    width: 100%;
    height: 45px;
    border-radius: 20px;
  }
  .btn-delete {
    background: red;
    color: white;
  }
</style>

<div id="app" class="container">
  <!-- PROMOTE SECTION -->
  <div class="section-box">
    <div class="section-title">Promote Information</div>

    <div class="form-grid">
      <!-- ADS IMAGE -->
      <div>
        <label>Ads Image</label>

        <div style="position: relative; width: 200px">
          <img
            :src="adsPreview || 'add-symbol-svgrepo-com.png'"
            @click="selectAdsImage"
            style="
              width: 200px;
              height: 200px;
              cursor: pointer;
              object-fit: cover;
              border: 2px dashed #bbb;
            "
          />

          <button
            v-if="adsPreview"
            @click="removeAdsImage"
            type="button"
            class="delete-btn"
          >
            ✕
          </button>

          <input
            type="file"
            ref="adsInput"
            hidden
            accept="image/*"
            @change="onAdsChange"
          />
        </div>
      </div>

      <!-- COLLAB TYPE -->
      <div>
        <label>Collab Type</label>
        <select v-model="collabType">
          <option value="">Select</option>
          <option>การ์ตูน</option>
          <option>อนิเมะ</option>
          <option>หนัง</option>
          <option>เกม</option>
          <option>Other</option>
        </select>

        <input
          v-if="collabType === 'Other'"
          type="text"
          placeholder="Specify"
          style="margin-top: 10px"
        />
      </div>

      <!-- START DATE -->
      <div>
        <label>Start Date</label>
        <input
          type="date"
          v-model="startDate"
          :min="today"
          @change="validateDates"
        />
      </div>

      <!-- END DATE -->
      <div>
        <label>End Date</label>
        <input
          type="date"
          v-model="endDate"
          :min="startDate || today"
          @change="validateDates"
        />
      </div>
    </div>

    <p v-if="dateError" style="color: red; margin-top: 10px">{{ dateError }}</p>
  </div>

  <!-- COLLAB DOCUMENTS -->
  <!-- COLLAB DOCUMENTS -->
  <div class="section-box">
    <div class="section-title">Collab Documents</div>

    <div class="horizontal-images">
      <div
        v-for="(doc, index) in documents"
        :key="index"
        style="
          position: relative;
          width: 200px;
          height: 200px;
          border: 2px dashed #bbb;
          border-radius: 10px;
          overflow: hidden;
          display: flex;
          align-items: center;
          justify-content: center;
        "
      >
        <!-- IMAGE PREVIEW -->
        <img
          v-if="doc.type.startsWith('image/')"
          :src="doc.preview"
          style="width: 100%; height: 100%; object-fit: cover"
        />

        <!-- PDF PREVIEW -->
        <iframe
          v-else-if="doc.type === 'application/pdf'"
          :src="doc.preview"
          style="width: 100%; height: 100%; border: none"
        >
        </iframe>

        <!-- OTHER FILES -->
        <div v-else style="text-align: center; padding: 10px">
          📄
          <p style="font-size: 12px">{{ doc.name }}</p>
        </div>

        <button class="delete-btn" @click="removeDocument(index)" type="button">
          ✕
        </button>
      </div>

      <div class="add-box" @click="selectDocument">+</div>
    </div>

    <input
      type="file"
      ref="documentInput"
      hidden
      multiple
      accept=".pdf,.doc,.docx,image/*"
      @change="onDocumentChange"
    />
  </div>

  <!-- PRODUCT ITEMS -->
  {% verbatim %}
  <div v-for="(product, pIndex) in products" :key="pIndex" class="section-box">
    <div class="section-title">Item {{ pIndex + 1 }}</div>

    <div class="form-grid">
      <div>
        <label>Product Image</label>

        <div style="position: relative; width: 200px">
          <img
            :src="product.preview || 'add-symbol-svgrepo-com.png'"
            @click="selectImage(pIndex)"
            style="
              width: 200px;
              height: 200px;
              cursor: pointer;
              object-fit: cover;
              border: 2px dashed #bbb;
            "
          />

          <button
            v-if="product.preview"
            @click="removeImage(pIndex)"
            type="button"
            class="delete-btn"
          >
            ✕
          </button>

          <input
            type="file"
            :ref="'fileInput' + pIndex"
            hidden
            accept="image/*"
            @change="onImageChange($event, pIndex)"
          />
        </div>
      </div>

      <div>
        <label>Detail</label>
        <textarea v-model="product.detail"></textarea>
      </div>
    </div>

    <div
      v-for="(sizeItem, sIndex) in product.sizes"
      :key="sIndex"
      class="form-grid"
      style="margin-top: 20px"
    >
      <div>
        <label>Size</label>
        <input v-model="sizeItem.size" />
      </div>

      <div>
        <label>Price</label>
        <input type="number" v-model.number="sizeItem.price" />
      </div>

      <div style="text-align: right">
        <button class="btn btn-delete" @click="removeSize(pIndex, sIndex)">
          Delete Size
        </button>
      </div>
    </div>

    <button class="btn" style="margin-top: 15px" @click="addSize(pIndex)">
      + Add Size
    </button>

    <div style="text-align: right; margin-top: 15px">
      <button class="btn btn-delete" @click="removeProduct(pIndex)">
        Delete Item
      </button>
    </div>
  </div>

  <button class="btn btn-add" style="margin-top: 20px" @click="addProduct">
    + Add Item
  </button>
  {% endverbatim %}
</div>

<script src="https://cdn.jsdelivr.net/npm/vue@2"></script>

<script>
  new Vue({
    el: "#app",

    data: {
      collabType: "",
      startDate: "",
      endDate: "",
      today: new Date().toISOString().split("T")[0],
      dateError: "",

      adsFile: null,
      adsPreview: "",

      documents: [],

      products: [
        {
          image: null,
          preview: "",
          detail: "",
          sizes: [{ size: "", price: "" }],
        },
      ],
    },

    methods: {
      validateDates() {
        if (this.startDate && this.endDate) {
          if (this.endDate < this.startDate) {
            this.dateError = "End date cannot be before Start date!";
            this.endDate = "";
          } else {
            this.dateError = "";
          }
        }
      },

      selectAdsImage() {
        this.$refs.adsInput.click();
      },

      onAdsChange(event) {
        const file = event.target.files[0];
        if (!file) return;

        this.adsFile = file;

        const reader = new FileReader();
        reader.onload = (e) => {
          this.adsPreview = e.target.result;
        };
        reader.readAsDataURL(file);
      },

      removeAdsImage() {
        this.adsFile = null;
        this.adsPreview = "";
      },

      addProduct() {
        this.products.push({
          image: null,
          preview: "",
          detail: "",
          sizes: [{ size: "", price: "" }],
        });
      },

      removeProduct(index) {
        this.products.splice(index, 1);
      },

      addSize(productIndex) {
        this.products[productIndex].sizes.push({ size: "", price: "" });
      },

      removeSize(productIndex, sizeIndex) {
        this.products[productIndex].sizes.splice(sizeIndex, 1);
      },

      selectImage(index) {
        this.$refs["fileInput" + index][0].click();
      },

      onImageChange(event, index) {
        const file = event.target.files[0];
        if (!file) return;

        this.products[index].image = file;

        const reader = new FileReader();
        reader.onload = (e) => {
          this.products[index].preview = e.target.result;
        };
        reader.readAsDataURL(file);
      },

      removeImage(index) {
        this.products[index].image = null;
        this.products[index].preview = "";
      },
      // ===== DOCUMENT FUNCTIONS =====
      selectDocument() {
        this.$refs.documentInput.click();
      },

      onDocumentChange(event) {
        const files = event.target.files;
        if (!files.length) return;

        for (let i = 0; i < files.length; i++) {
          const file = files[i];

          this.documents.push({
            file: file,
            name: file.name,
            type: file.type,
            preview: URL.createObjectURL(file),
          });
        }

        event.target.value = "";
      },

      removeDocument(index) {
        this.documents.splice(index, 1);
      },
    },
  });
</script>

{% endblock %}
