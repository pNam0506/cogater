{% block title %}
<title>Login</title>
{% endblock %}

{% block content %}

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <div
        style="display: flex; justify-content: center; align-items: center; height: 100vh; background-color: gainsboro;">

        <div
            style="background-color: white; height: 260px; width: 300px; display: flex; justify-content: center; align-items: center; border-radius: 10px; position: relative;">

            <div style="display: grid; gap: 20px;">

                <label style="text-align: center; font-weight: bold;">COMPANY LOGIN</label>

                <div>
                    <label>Username</label>
                    <input type="text" name="username_com" required>
                </div>

                <div>
                    <label>Password</label>
                    <input type="password" name="password_com" required>
                </div>

                <button type="submit">Login</button>
               
                <a href="{% url 'signup_com' %}" type="button" >Signup</a>
                
                
            </div>
        </div>
    </div>



</form>


{% if messages %}
<ul>
    {% for message in messages %}
    <li>{{ message }}</li>
    {% endfor %}
</ul>
{% endif %}
{% endblock %}
