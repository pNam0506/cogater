{% extends "base_web.html" %}

{% block title %}
<title>Report</title>
{% endblock %}

{% block content %}
<style>

    width: 100%;
    height: 400px;
    background-color: rgb(255, 255, 255);
    border-radius: 20px;
    box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);

  }

  textarea {
    border-radius: 10px;
  }

    color: red;

</style>
<script src="https://cdn.jsdelivr.net/npm/vue@2"></script>

<div id="app">
  <div  class="date" style="font-size: 24px; font-weight: bold; margin: 20px;">
    Date: ${ time }
  </div>
  


  <div style=" display: grid; grid-template-columns: repeat(1); gap: 10px; ">
    <div class="box">

      <div style="margin-left: 50px; ">
        <h3>Main Information</h3>
      </div>


      <div style="display: grid; grid-template-columns: repeat(2, 200px); gap: 10px; margin-left: 25%;">

        <div>
          <label>Company Name</label><br>
          <textarea style="width: 200px; height: 50px; padding-inline-start: 0; resize: none; white-space: pre-wrap;"
            placeholder="พิมพ์ข้อความที่นี่..."></textarea>
        </div>

        <div>
          <label>Store</label><br>
          <textarea style="width: 300px; height: 50px; padding-inline-start: 0; resize: none; white-space: pre-wrap;"
            placeholder="พิมพ์ข้อความที่นี่..."></textarea>
        </div>

        <div>
          <label>Company Address</label><br>
        </div>
        <div>
          <textarea style="width: 300px; height: 100px; padding-inline-start: 0; resize: none; white-space: pre-wrap;"
            placeholder="พิมพ์ข้อความที่นี่..."></textarea>
        </div>

        <div>
          <label>Operator Name</label><br>
          <textarea style="width: 200px; height: 50px; padding-inline-start: 0; resize: none; white-space: pre-wrap;"
            placeholder="พิมพ์ข้อความที่นี่..."></textarea>
        </div>

        <div>
          <label for="phone">Phone</label>
          <input style="border-radius: 10px;" type="tel" id="phone" name="phone" placeholder="กรอกเบอร์โทรศัพท์"
            pattern="^0[0-9]{9}$" title="กรุณากรอกเบอร์โทรศัพท์ให้ถูกต้อง (เช่น 0812345678)" maxlength="10" required>
          <span id="error" class="error">กรอกได้เฉพาะตัวเลขเท่านั้น</span>
        </div>




      </div>

      <div>
        <input type="submit" value="Save" style="position: relative; margin-left: 1000px; width: 100px;">
      </div>






    </div>

    <div class="box">

      <div style="margin-left: 50px; ">
        <h3>Promote Information</h3>
      </div>


      <div
        style="display: grid; grid-template-columns: 200px 200px 200px; grid-template-rows: 200px 100px; gap: 10px; margin-left: 25%;">

        <div class="input-group" style="grid-row: 1/3 ;">
          <label for="picture">Ads image (รูปจะถูกโปรโมทหน้าเว็บ)</label><br>
          <input type="file" id="picture" name="picture" accept="image/*" style="display: none;">
          <img id="preview" style="width: 200px; height: 200px; margin-top: 10px;" src="add-symbol-svgrepo-com.png">
          <input id="change_image" type="submit" value="change">
        </div>

        <div id="modal" style="
     display:none; 
     position:fixed; 
     top:0; left:0; width:100%; height:100%; 
     background:rgba(0,0,0,0.8); 
     justify-content:center; align-items:center;">
          <span id="closeModal" style="
        position:absolute; top:20px; right:30px; color:white; font-size:30px; cursor:pointer;">&times;</span>
          <img id="modalImg" src="" style="max-width:90%; max-height:90%; border-radius:10px;">
        </div>



        <div>
          <label for="store">Collab type</label><br>
          <select v-model="value" style="width: 200px; padding: 5px; border-radius: 5px;">
            <option value="">All</option>
            <option value="snack">การ์ตูน</option>
            <option value="utility">อนิเมะ</option>
            <option value="clothing">หนัง</option>
            <option value="game">เกม</option>
            <option value="Other">Other</option>

          </select>

          <input v-if="value === 'Other'" type="text" placeholder="กรอกชื่อร้านค้าอื่น ๆ">

        </div>



        <div>
          <label>Collab With</label><br>
          <textarea style="padding-inline-start: 0; resize: none; white-space: pre-wrap;"
            placeholder="พิมพ์ข้อความที่นี่..."></textarea>
        </div>

        <div style="margin-top: -100px; grid-column: 2/4;">
          <label>Import License file</label><br>
          <input type="file" accept=".pdf" multiple>
        </div>

        <div style="margin-top: -110px; grid-column: 2/3;">
          <label for="phone">Start</label><br>
          <input type="date">
        </div>

        

        <div style="margin-top: -110px;">
          <label for="phone">End</label><br>
          <input type="date">
          
        </div>




      </div>

      <div>
        <input type="submit" value="Save" style="position: relative; margin-left: 1000px; width: 100px;">
      </div>






    </div>
  </div>

</div>

<script>
  new Vue({
    el: '#app',
    delimiters: ['${', '}'], // ใช้ ${ ... } แทน {{ ... }} เพื่อไม่ชนกับ Django
    data: {
      time: '{{ current_time }}',
      value: ''
    },
    methods: {
      updateClock() {
        const now = new Date();
        this.time = now.toLocaleTimeString('th-TH', {
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        });
      }
    },
    mounted() {
      this.updateClock();
      setInterval(this.updateClock, 1000);
    }
  });

  const phone = document.getElementById('phone');
  const error = document.getElementById('error');

  phone.addEventListener('keydown', function (event) {
    const allowedKeys = ['Backspace', 'Delete', 'ArrowLeft', 'ArrowRight', 'Tab', 'Enter'];

    // อนุญาตเฉพาะตัวเลขหรือปุ่มพิเศษ
    if ((event.key >= '0' && event.key <= '9') || allowedKeys.includes(event.key)) {
      error.style.display = 'none'; // ซ่อนข้อความเตือนเมื่อพิมพ์ถูก
      return;
    } else {
      event.preventDefault(); // บล็อกตัวอักษรที่ไม่ใช่ตัวเลข
      error.style.display = 'block'; // แสดงข้อความเตือน
    }
  });

  const pictureInput = document.getElementById('picture');
  const preview = document.getElementById('preview');

  pictureInput.addEventListener('change', function () {
    const file = this.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function (e) {
        preview.src = e.target.result;
        preview.style.display = 'block';
      }
      reader.readAsDataURL(file);
    } else {
      preview.style.display = 'none';
    }
  });



  const change_image = document.getElementById('change_image');

  change_image.addEventListener('click', () => pictureInput.click())

  const modal = document.getElementById('modal');
  const modalImg = document.getElementById('modalImg');
  const closeModal = document.getElementById('closeModal');


  // คลิกที่ preview เพื่อเปิด modal
  preview.addEventListener('click', () => {
    modalImg.src = preview.src;
    modal.style.display = 'flex';
  });

  // ปิด modal
  closeModal.addEventListener('click', () => modal.style.display = 'none');
  modal.addEventListener('click', e => {
    if (e.target === modal) modal.style.display = 'none';
  });

</script>
{% endblock %}
