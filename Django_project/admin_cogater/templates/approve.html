<h2>Approved Reports</h2>

{% for r in reports %}

<div style="padding:10px;border:1px solid #ddd;margin-bottom:10px">

<a href="{% url 'report_detail' r.id %}">
Report {{ r.id }} - {{ r.name }}
</a>

<p>Approved at: {{ r.approved_at }}</p>

<p>Approved by: {{ r.approved_by }}</p>

</div>

{% empty %}

<p>No approved reports</p>

{% endfor %}

<a href="{% url 'admin_home' %}">
<button>Back</button>
</a>
