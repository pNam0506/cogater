{% extends "base_admin.html" %}

{% block content %}

<style>

.container{
    max-width:900px;
    margin:auto;
    font-family:Arial, Helvetica, sans-serif;
}

.title{
    text-align:center;
    font-size:28px;
    margin-bottom:30px;
}

.notification-card{
    padding:15px;
    border-radius:8px;
    background:white;
    box-shadow:0 3px 8px rgba(0,0,0,0.08);
    margin-bottom:15px;
    transition:0.2s;
}

.notification-card:hover{
    transform:scale(1.02);
    background:#f8f9fa;
}

.notification-card a{
    text-decoration:none;
    color:#2c3e50;
    font-weight:bold;
}

.empty{
    text-align:center;
    color:#888;
}

.back-btn{
    display:block;
    margin:30px auto;
    padding:10px 20px;
    border:none;
    border-radius:6px;
    background:#34495e;
    color:white;
    cursor:pointer;
}

.back-btn:hover{
    background:#2c3e50;
}

.time{
    font-size:12px;
    color:#888;
    margin-top:5px;
}

</style>


<div class="container">

<div class="title">
🔔 New Notifications
</div>


{% for n in notifications %}

<div class="notification-box">

<a href="{% url 'report_detail' n.id %}">
{{ n.name }}
</a>

</div>

{% empty %}

<p>No notifications</p>

{% endfor %}


<a href="{% url 'admin_home' %}">
<button class="back-btn">⬅ Back to Dashboard</button>
</a>

</div>

{% endblock %}
